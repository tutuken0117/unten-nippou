const OD_SCOPES = ["Files.ReadWrite"];
let msalInstance = null;
function ensureMsal(){
  if(msalInstance) return msalInstance;
  if(typeof msal === 'undefined') return null;
  msalInstance = new msal.PublicClientApplication(MSAL_CONFIG);
  return msalInstance;
}
async function odGetAccount(){
  const app = ensureMsal();
  if(!app) return null;
  await app.initialize();
  const accounts = app.getAllAccounts();
  return accounts.length ? accounts[0] : null;
}
async function odLogin(){
  const app = ensureMsal();
  if(!app) throw new Error("OneDrive連携ライブラリの読み込みに失敗しました");
  await app.initialize();
  const result = await app.loginPopup({ scopes: OD_SCOPES });

}
async function odLogout(){
  const app = ensureMsal();
  if(!app) return;
  await app.initialize();
  const account = app.getAllAccounts()[0];
  if(account) await app.logoutPopup({ account });
}
async function odGetToken(){
  const app = ensureMsal();
  if(!app) throw new Error("OneDrive連携ライブラリの読み込みに失敗しました");
  await app.initialize();
  const account = app.getAllAccounts()[0];
  if(!account) throw new Error("OneDriveと連携されていません");
  try{
    const res = await app.acquireTokenSilent({ scopes: OD_SCOPES, account });
    return res.accessToken;
  }catch(e){
    const res = await app.acquireTokenPopup({ scopes: OD_SCOPES, account });
    return res.accessToken;
  }
}
async function odUploadPdf(blob, filename){
  const token = await odGetToken();
  const path = encodeURIComponent(filename).replace(/%2F/g, '/');
  const url = `https://graph.microsoft.com/v1.0/me/drive/root:/運転日報/${path}:/content`;
  const res = await fetch(url, {
    method: "PUT",
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/pdf",
    },
    body: blob,
  });
  if(!res.ok){
    const text = await res.text().catch(()=> "");
    throw new Error(`OneDriveへのアップロードに失敗しました (${res.status}) ${text}`);
  }
  return await res.json();
}

/* ---------- 祝日計算（ハッピーマンデー・振替休日・国民の休日・春秋分を含む） ---------- */
function nthMonday(year, month, n){
  const d = new Date(year, month-1, 1);
  let count = 0;
  while(true){
    if(d.getDay() === 1){ count++; if(count === n) return new Date(d); }
    d.setDate(d.getDate()+1);
  }
}
function equinox(year, kind){
  // kind: 'spring' | 'autumn' — 2000-2099年で有効な近似式
  const base = kind === 'spring' ? 20.8431 : 23.2488;
  const day = Math.floor(base + 0.242194*(year-1980) - Math.floor((year-1980)/4));
  return new Date(year, kind==='spring'?2:8, day);
}
function ymd(d){ return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

function baseHolidays(year){
  const list = [];
  const add = (date, name) => list.push({date, name});
  add(new Date(year,0,1), "元日");
  add(nthMonday(year,1,2), "成人の日");
  add(new Date(year,1,11), "建国記念の日");
  add(new Date(year,1,23), "天皇誕生日");
  add(equinox(year,'spring'), "春分の日");
  add(new Date(year,3,29), "昭和の日");
  add(new Date(year,4,3), "憲法記念日");
  add(new Date(year,4,4), "みどりの日");
  add(new Date(year,4,5), "こどもの日");
  add(nthMonday(year,7,3), "海の日");
  add(new Date(year,7,11), "山の日");
  add(nthMonday(year,9,3), "敬老の日");
  add(equinox(year,'autumn'), "秋分の日");
  add(nthMonday(year,10,2), "スポーツの日");
  add(new Date(year,10,3), "文化の日");
  add(new Date(year,10,23), "勤労感謝の日");
  return list;
}
function holidaySetForYear(year){
  // 前年末〜翌年始も少し含めて振替休日を正しく判定
  let all = [...baseHolidays(year-1), ...baseHolidays(year), ...baseHolidays(year+1)];
  const map = new Map();
  all.forEach(h => map.set(ymd(h.date), h.name));

  // 振替休日：祝日が日曜なら、その後の最初の非祝日平日を休日に
  const additions = [];
  all.forEach(h => {
    if(h.date.getDay() === 0){
      let d = new Date(h.date);
      do{ d.setDate(d.getDate()+1); } while(map.has(ymd(d)));
      additions.push({date:new Date(d), name:"振替休日"});
    }
  });
  additions.forEach(h => map.set(ymd(h.date), h.name));

  // 国民の休日：祝日と祝日に挟まれた平日
  const sorted = [...map.keys()].map(k=>{
    const [y,m,d] = k.split('-').map(Number);
    return new Date(y,m-1,d);
  }).sort((a,b)=>a-b);
  sorted.forEach(d=>{
    const next = new Date(d); next.setDate(next.getDate()+2);
    const between = new Date(d); between.setDate(between.getDate()+1);
    if(map.has(ymd(next)) && !map.has(ymd(between)) && between.getDay()!==0){
      map.set(ymd(between), "国民の休日");
    }
  });
  return map;
}

function isHoliday(date, holidayMap){
  return holidayMap.has(ymd(date));
}

function seededMonth(y, m){
  const base = emptyMonth(y, m);
  if(y === 2026 && m === 7){
    Object.entries(SEED_2026_07.daysPartial).forEach(([dayNum, patch]) => {
      const idx = parseInt(dayNum, 10) - 1;
      if(base.days[idx]) base.days[idx] = { ...base.days[idx], ...patch };
    });
  }
  return base;
}

function lastNumeric(days, idx, key, baseline){
  for(let i=idx-1; i>=0; i--){
    const v = days[i][key];
    if(v !== "" && v !== null && v !== undefined && !isNaN(parseFloat(v))) return parseFloat(v);
  }
  return (baseline!=="" && baseline!==null && baseline!==undefined && !isNaN(parseFloat(baseline))) ? parseFloat(baseline) : null;
}

    const t = setTimeout(() => {
      const el = document.getElementById('day-card-' + todayNum);
      if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 250);
    return () => clearTimeout(t);
  }, [ready, view, monthData && monthData.year, monthData && monthData.month]);

  const LS_PREFIX = 'untenNippou:';
  const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage;

  async function safeGet(key){
    if(hasClaudeStorage){
      try{
        const r = await window.storage.get(key, false);
        return r ? JSON.parse(r.value) : null;
      }catch(e){ /* フォールバックへ */ }
    }
    try{
      const v = localStorage.getItem(LS_PREFIX + key);
      return v !== null ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }

  async function safeSet(key, value){
    setSaveState('saving');
    try{
      if(hasClaudeStorage){
        const r = await window.storage.set(key, JSON.stringify(value), false);
        if(!r){ throw new Error('保存結果が空でした'); }
      } else {
        localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
      }
      setSaveState('saved');
      if(syncCode){
        cloudPush(syncCode, key, value).then(ok => setSyncState(ok ? 'synced' : 'error'));
      }
      return true;
    }catch(e){
      console.error("save failed", key, e);
      setSaveState('error');
      showToast('⚠ 保存に失敗しました。ブラウザの設定でCookie/サイトデータがブロックされていないかご確認ください。');
      return false;
    }
  }

  async function applySyncCode(code){
    const trimmed = code.trim();
    try{ localStorage.setItem(SYNC_CODE_KEY, trimmed); }catch(e){}
    setSyncCode(trimmed);
    setShowSyncModal(false);
    if(!trimmed){ setSyncState('off'); return; }
    setSyncState('syncing');
    const cloud = await cloudPullAll(trimmed);
    if(cloud === null){ setSyncState('error'); showToast('⚠ クラウドへの接続に失敗しました'); return; }
    for(const [k,v] of Object.entries(cloud)){
      if(hasClaudeStorage){
        try{ await window.storage.set(k, JSON.stringify(v), false); }catch(e){}
      } else {
        try{ localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); }catch(e){}
      }
    }
    setSyncState('synced');
    showToast('クラウドの最新データを読み込みました');
    window.location.reload();
  }

  async function addToMonthList(key){
    const list = (await safeGet('monthList')) || [];
    if(!list.includes(key)){
      const next = [...list, key].sort();
      await safeSet('monthList', next);
      setMonthList(next);
    } else {
      setMonthList(list);
    }
  }

  async function init(){
    const now = new Date();
    const curKey = monthKey(now.getFullYear(), now.getMonth()+1);

    let currentSyncCode = '';
    try{ currentSyncCode = localStorage.getItem(SYNC_CODE_KEY) || ''; }catch(e){}
    if(currentSyncCode){
      setSyncState('syncing');
      const cloud = await cloudPullAll(currentSyncCode);
      if(cloud){
        for(const [k,v] of Object.entries(cloud)){
          if(hasClaudeStorage){
            try{ await window.storage.set(k, JSON.stringify(v), false); }catch(e){}
          } else {
            try{ localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); }catch(e){}
          }
        }
        setSyncState('synced');
      } else {
        setSyncState('error');
      }
    }

    const p = await safeGet('profile');
    if(p) setProfile({...p, driverName:"佐々木晃史"});

    const b = await safeGet('baseline');
    if(b) setBaseline(b);

    const ui = await safeGet('undoInfo');
    if(ui) setUndoInfo(ui);

    const ml = await safeGet('monthList');
    if(ml) setMonthList(ml);

    const active = await safeGet('activeMonth');

    if(!active){
      // 初回起動
      const fresh = seededMonth(now.getFullYear(), now.getMonth()+1);
      await safeSet('activeMonth', curKey);
      await safeSet(`month:${curKey}`, fresh);
      await addToMonthList(curKey);
      setActiveKey(curKey);
      setMonthData(fresh);
      if(now.getFullYear() === 2026 && now.getMonth()+1 === 7){
        const seedBaseline = { odo: SEED_2026_07.baseline.odo, fuelOdo: SEED_2026_07.baseline.fuelOdo };
        setBaseline(seedBaseline);
        await safeSet('baseline', seedBaseline);
      }
      setReady(true);
      return;
    }

    if(active !== curKey){
      // 月またぎ検出 → ロールオーバー確認
      const data = await safeGet(`month:${active}`) || emptyMonth(...active.split('-').map(Number));
      setActiveKey(active);
      setMonthData(data);
      setPendingKey(curKey);
      setShowRollover(true);
      setReady(true);
      return;
    }

    const data = await safeGet(`month:${active}`) || emptyMonth(now.getFullYear(), now.getMonth()+1);
    setActiveKey(active);
    setMonthData(data);
    setReady(true);
  }

  const persistMonth = useCallback(async (key, data) => {
    setMonthData(data);
    await safeSet(`month:${key}`, data);
  }, []);

  const [crossMonthDests, setCrossMonthDests] = useState([]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const freq = {};
      for(const key of monthList){
        if(key === activeKey) continue; // 今月は別途ライブで集計するので除く
        const d = await safeGet(`month:${key}`);
        if(d && d.days){
          d.days.forEach(day => {
            const v = (day.dest || '').trim();
            if(v) freq[v] = (freq[v]||0) + 1;
          });
        }
      }
      if(cancelled) return;
      const sorted = Object.keys(freq).sort((a,b)=>freq[b]-freq[a]);
      setCrossMonthDests(sorted);
    })();
    return () => { cancelled = true; };
  }, [monthList, activeKey]);

  const updateDay = (idx, patch) => {
    const next = {...monthData, days: monthData.days.map((d,i)=> i===idx ? {...d, ...patch} : d)};
    persistMonth(activeKey, next);
  };

  const pickDest = (idx, value) => {
    updateDay(idx, {dest: value});
  };

  async function doRollover(saveFirst){
    if(saveFirst){ triggerPrint(); }
    // 今月データから最後の入庫時・給油時を拾ってbaselineへ
    let lastOdo = null, lastFuel = null;
    for(let i=monthData.days.length-1;i>=0;i--){
      const d = monthData.days[i];
      if(lastOdo===null && d.odo!=="" && !isNaN(parseFloat(d.odo))) lastOdo = parseFloat(d.odo);
      if(lastFuel===null && d.fuelOdo!=="" && !isNaN(parseFloat(d.fuelOdo))) lastFuel = parseFloat(d.fuelOdo);
      if(lastOdo!==null && lastFuel!==null) break;
    }
    const newBaseline = {
      odo: lastOdo!==null ? lastOdo : baseline.odo,
      fuelOdo: lastFuel!==null ? lastFuel : baseline.fuelOdo,
    };

    // 元に戻せるよう、切り替え前の状態を保存しておく
    const undo = { fromKey: activeKey, toKey: pendingKey, prevBaseline: baseline };
    setUndoInfo(undo);
    await safeSet('undoInfo', undo);

    setBaseline(newBaseline);
    await safeSet('baseline', newBaseline);

    const [ny, nm] = pendingKey.split('-').map(Number);
    // 既にそのキーでデータが存在する場合（一度リセットしてから戻し、また進めた場合など）は上書きしない
    const existing = await safeGet(`month:${pendingKey}`);
    const fresh = existing || emptyMonth(ny, nm);
    await safeSet(`month:${pendingKey}`, fresh);
    await addToMonthList(pendingKey);
    await safeSet('activeMonth', pendingKey);
    setActiveKey(pendingKey);
    setMonthData(fresh);
    setShowRollover(false);
    showToast(`${ny}年${nm}月分の準備ができました`);
  }

  async function undoRollover(){
    if(!undoInfo) return;
    const data = await safeGet(`month:${undoInfo.fromKey}`) || emptyMonth(...undoInfo.fromKey.split('-').map(Number));
    setBaseline(undoInfo.prevBaseline);
    await safeSet('baseline', undoInfo.prevBaseline);
    await safeSet('activeMonth', undoInfo.fromKey);
    setActiveKey(undoInfo.fromKey);
    setMonthData(data);
    setUndoInfo(null);
    await safeSet('undoInfo', null);
    showToast(`${undoInfo.fromKey}分に戻しました`);
  }

  async function switchToMonth(key){
    if(key === activeKey){ setShowHistory(false); return; }
    const data = await safeGet(`month:${key}`) || emptyMonth(...key.split('-').map(Number));
    await safeSet('activeMonth', key);
    setActiveKey(key);
    setMonthData(data);
    setShowHistory(false);
    showToast(`${key}分を表示しています`);
  }

  const [pdfBusy, setPdfBusy] = useState(false);
  const [pdfReady, setPdfReady] = useState(null); // {blob, fname}

  async function uploadPdfToOneDrive(){

    setOdBusy(true);

  async function triggerPrint(){
    if(pdfBusy) return;
    setPdfBusy(true);
    const prevView = view;
    if(view !== 'preview') setView('preview');
    // レイアウトが確定するまで少し待つ
    await new Promise(r => requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(r, 120))));

    const withTimeout = (promise, ms, label) => Promise.race([
      promise,
      new Promise((_, rej) => setTimeout(()=>rej(new Error(`${label}がタイムアウトしました（${ms/1000}秒）`)), ms))
    ]);

    try{
      const el = document.querySelector('.page-frame');
      if(!el){
        showToast('プレビュー画面の読み込みが間に合いませんでした。もう一度お試しください。');
        return;
      }
      if(typeof html2canvas === 'undefined' || !window.jspdf){
        showToast('PDF機能のライブラリ読み込みに失敗しました。通信環境をご確認のうえ、ページを再読み込みしてから再度お試しください。');
        return;
      }
      const canvas = await withTimeout(
        html2canvas(el, {scale:2, backgroundColor:'#ffffff', useCORS:true}),
        12000, 'PDF画像の作成'
      );
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({orientation:'portrait', unit:'pt', format:'a4'});
      const margin = 24;
      const pageW = pdf.internal.pageSize.getWidth() - margin*2;
      const pageH = pdf.internal.pageSize.getHeight() - margin*2;
      let w = pageW;
      let h = (canvas.height * w) / canvas.width;
      if(h > pageH){ h = pageH; w = (canvas.width * h) / canvas.height; }
      const x = margin + (pageW - w)/2;
      pdf.addImage(imgData, 'PNG', x, margin, w, h);
      const fname = `運転日報${monthData.year}年${monthData.month}月.pdf`;
      const pdfBlob = pdf.output('blob');
      setPdfReady({blob: pdfBlob, fname});
    }catch(e){
      console.error(e);
      showToast('PDF作成でエラーが発生しました：' + (e && e.message ? e.message : e));
    }finally{
      setPdfBusy(false);
      if(prevView !== 'preview') setView(prevView);
    }
  }

  async function doSharePdf(){
    if(!pdfReady) return;
    try{
      const file = new File([pdfReady.blob], pdfReady.fname, {type:'application/pdf'});
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:pdfReady.fname});
        showToast('共有シートからOneDriveなどに保存できます');
        setPdfReady(null);
      } else {
        showToast('この端末は共有機能に対応していません。「PDFを保存」をお使いください');
      }
    }catch(e){
      if(e && e.name === 'AbortError'){ /* キャンセルは何もしない */ }
      else { console.error(e); showToast('共有に失敗しました'); }
    }
  }

  function doDownloadPdf(){
    if(!pdfReady) return;
    const url = URL.createObjectURL(pdfReady.blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = pdfReady.fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    showToast('PDFをダウンロードしました');
    setPdfReady(null);
  }

  const holidayMap = useMemo(() => monthData ? holidaySetForYear(monthData.year) : new Map(), [monthData && monthData.year]);

  if(!ready || !monthData){

  const effs = days.map((d,i)=> effFor(days,i,baseline.fuelOdo,d.gas)).filter(v=>v!==null);
  const avgEff = effs.length ? (effs.reduce((a,b)=>a+b,0)/effs.length) : null;

  const liveDest = Array.from(new Set(days.map(d=>(d.dest||'').trim()).filter(Boolean)));

  return (

        <span className="note-right">

                <td colSpan={2}>先月の最終</td>
                <td className="num">{baseline.odo}</td><td className="col-dist num"></td>
                <td className="num">{baseline.fuelOdo}</td><td className="col-fdist num"></td>
                <td></td><td className="col-eff num"></td><td></td><td></td>
              </tr>
              {days.map((d,i)=>{
                const date = new Date(monthData.year, monthData.month-1, i+1);
                const wd = WD[date.getDay()];
                const holiday = date.getDay()===0 || isHoliday(date, holidayMap);
                const dist = distanceFor(days,i,baseline.odo);
                const fuelDist = fuelDistFor(days,i,baseline.fuelOdo);
                const eff = effFor(days,i,baseline.fuelOdo,d.gas);
                return (
                  <tr key={i} className={holiday?"holiday":""}>
                    <td className="day-cell">{i+1}</td>
                    <td className="day-cell">{wd}</td>
                    <td className="num">{d.odo}</td>
                    <td className="col-dist num">{dist!==null?dist:''}</td>
                    <td className="num">{d.fuelOdo}</td>
                    <td className="col-fdist num">{fuelDist!==null?fuelDist:''}</td>
                    <td className="num">{d.gas}</td>
                    <td className="col-eff num">{eff!==null?eff.toFixed(1):''}</td>
                    <td>{d.oil?'✓':''}</td>
                    <td className="dest">{d.dest}</td>
                  </tr>
                );
              })}
              <tr className="foot">
                <td colSpan={2}>合計・平均</td>
                <td></td>
                <td className="col-dist num">{totalDist}km</td><td className="num"></td><td className="col-fdist num"></td>
                <td className="num">{totalGas}ℓ</td>
                <td className="col-eff num">{avgEff? avgEff.toFixed(1):''}</td><td></td><td></td>
              </tr>
            </tbody>
          </table>
          </div>
        </div>
      </div>

      {pdfReady && (
        <div className="modal-backdrop no-print" onClick={()=>setPdfReady(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h2>PDFの準備ができました</h2>

            {odAccount ? (
              <button className="pdf-action-btn primary" onClick={uploadPdfToOneDrive} disabled={odBusy}>
                {odBusy ? '保存中…' : '☁ OneDriveに保存（運転日報フォルダ）'}
              </button>
            ) : (
              <button className="pdf-action-btn primary" onClick={async ()=>{ await connectOneDrive(); }} disabled={odBusy}>
                {odBusy ? '連携中…' : '☁ OneDriveと連携して保存'}
              </button>
            )}

            <button className="pdf-action-btn" onClick={doSharePdf}>
              🔗 共有する（その他のアプリ）
            </button>
            <button className="pdf-action-btn" onClick={doDownloadPdf}>
              ⬇ PDFを保存（ダウンロード）
            </button>
            <p className="pdf-note">
              {odAccount
                ? `OneDriveの「運転日報」フォルダに自動保存されます（連携アカウント：${odAccount.username}）。`
                : '初回は「OneDriveと連携して保存」からMicrosoftアカウントでログインしてください。以降はワンタップで保存されます。'}
              {odAccount && <> <span className="od-disconnect" onClick={disconnectOneDrive}>連携を解除する</span></>}
            </p>
            <div className="mbtns" style={{marginTop:10}}>
              <button className="btn secondary" onClick={()=>setPdfReady(null)} style={{flex:1}}>閉じる</button>
            </div>
          </div>
        </div>
      )}

      {showHistory && (
        <div className="modal-backdrop no-print" onClick={()=>setShowHistory(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h2>月を切り替える</h2>
            <p>表示・編集したい月を選んでください。データはすべて残っているので、いつでも切り替えられます。</p>
            <div className="month-list">
              {[...monthList].sort().reverse().map(key => (
                <button
                  key={key}
                  className={"month-list-item" + (key===activeKey ? " current" : "")}
                  onClick={()=>switchToMonth(key)}>
                  {key}{key===activeKey ? "（現在表示中）" : ""}
                </button>
              ))}
            </div>
            <div className="mbtns" style={{marginTop:14}}>
              <button className="btn secondary" onClick={()=>setShowHistory(false)} style={{flex:1}}>閉じる</button>
            </div>
          </div>
        </div>
      )}

      {showRollover && (
        <div className="modal-backdrop no-print">
          <div className="modal">
            <h2>{pendingKey}分の準備をしますか？</h2>
            <p>
              {monthData.year}年{monthData.month}月分のデータが入力されています。<br/>
              PDFに保存してから、新しい月の入力欄を準備できます。<br/>
              「あとで」を選ぶと、今のデータのまま何も変更しません。<br/>
              ＊実行後も「元に戻す」でいつでも{monthData.year}年{monthData.month}月分に戻せます。データが消えることはありません。
            </p>
            <div className="mbtns">
              <button className="btn secondary" onClick={()=>setShowRollover(false)} style={{flex:1}}>あとで</button>
              <button className="btn" onClick={()=>doRollover(true)} style={{flex:2}}>PDF保存して準備する</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}

      <div className="fixed-toolbar no-print">
        <div className="tabs">
          <button className={"tab" + (view==='input'?' active':'')} onClick={()=>setView('input')}>入力</button>
          <button className={"tab" + (view==='preview'?' active':'')} onClick={()=>setView('preview')}>提出用プレビュー</button>
        </div>
        <div className="actions">
          <button className="btn" onClick={()=>{ setPendingKey(nextMonthKey(monthData)); setShowRollover(true); }}>PDFに保存・翌月の準備</button>
        </div>
      </div>
    </React.Fragment>
  );
}

function distanceFor(days, idx, baselineOdo){
  const cur = days[idx].odo;
  if(cur==="" || cur===null || isNaN(parseFloat(cur))) return null;
  const prev = lastNumeric(days, idx, 'odo', baselineOdo);
  if(prev===null) return null;
  return Math.round((parseFloat(cur) - prev)*10)/10;
}
function fuelDistFor(days, idx, baselineFuel){
  const cur = days[idx].fuelOdo;
  if(cur==="" || cur===null || isNaN(parseFloat(cur))) return null;
  const prev = lastNumeric(days, idx, 'fuelOdo', baselineFuel);
  if(prev===null) return null;
  return Math.round((parseFloat(cur) - prev)*10)/10;
}
function effFor(days, idx, baselineFuel, gas){
  const fd = fuelDistFor(days, idx, baselineFuel);
  if(fd===null || gas==="" || gas===null || isNaN(parseFloat(gas)) || parseFloat(gas)===0) return null;
  return fd/parseFloat(gas);
}
function nextMonthKey(monthData){
  let y = monthData.year, m = monthData.month+1;
  if(m>12){ m=1; y++; }
  return monthKey(y,m);
}

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state = {error: null}; }
  static getDerivedStateFromError(error){ return {error}; }
  componentDidCatch(error, info){ console.error("App crashed:", error, info); }
  render(){
    if(this.state.error){
      return (
        <div style={{padding:'24px 18px', fontFamily:'sans-serif'}}>
          <h2 style={{fontSize:16, marginBottom:8}}>エラーが発生しました</h2>
          <p style={{fontSize:12, color:'#c14848', whiteSpace:'pre-wrap', lineHeight:1.6}}>
            {String((this.state.error && this.state.error.message) || this.state.error)}
          </p>
          <button
            onClick={()=>this.setState({error:null})}
            style={{marginTop:14, padding:'10px 16px', borderRadius:8, border:'none', background:'#3d6b52', color:'#fff', fontWeight:700}}>
            画面をやり直す
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

function GlobalErrorBanner(){
  const [msg, setMsg] = React.useState(null);
  React.useEffect(() => {
    const onErr = (e) => setMsg((e.error && e.error.message) || e.message || String(e));
    const onRej = (e) => setMsg('非同期エラー：' + ((e.reason && e.reason.message) || e.reason));
    window.addEventListener('error', onErr);
    window.addEventListener('unhandledrejection', onRej);
    return () => { window.removeEventListener('error', onErr); window.removeEventListener('unhandledrejection', onRej); };
  }, []);
  if(!msg) return null;
  return (
    <div style={{position:'fixed', top:0, left:0, right:0, background:'#c14848', color:'#fff', fontSize:11.5, padding:'8px 12px', zIndex:999, whiteSpace:'pre-wrap'}}>
      {msg}
      <button onClick={()=>setMsg(null)} style={{marginLeft:10, background:'transparent', border:'1px solid #fff', color:'#fff', borderRadius:5, padding:'1px 8px'}}>閉じる</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app-root')).render(
  <ErrorBoundary><GlobalErrorBanner /><App /></ErrorBoundary>
);
</script>
